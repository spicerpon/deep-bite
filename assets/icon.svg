<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Deep Bite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a8fc1"/>
      <stop offset="0.55" stop-color="#0b5f8e"/>
      <stop offset="1" stop-color="#041a33"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc54a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <circle cx="40" cy="30" r="46" fill="url(#glow)"/>
  <!-- plankton -->
  <circle cx="24" cy="98" r="3" fill="#4fd8ff" opacity="0.9"/>
  <circle cx="118" cy="40" r="2.5" fill="#4fd8ff" opacity="0.8"/>
  <circle cx="104" cy="112" r="2" fill="#ffe08a" opacity="0.8"/>
  <!-- bubbles -->
  <circle cx="112" cy="72" r="4" fill="none" stroke="#bfe9ff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="121" cy="58" r="2.5" fill="none" stroke="#bfe9ff" stroke-width="1.3" opacity="0.6"/>
  <!-- fish -->
  <g transform="translate(70 76)">
    <path d="M-30 0 L-50 -20 L-44 0 L-50 20 Z" fill="#ff8a1f"/>
    <path d="M-8 -22 Q 2 -36 14 -22 Z" fill="#ff8a1f"/>
    <ellipse cx="0" cy="0" rx="44" ry="26" fill="url(#body)"/>
    <path d="M-20 10 Q -4 26 14 14" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- gill -->
    <path d="M12 -14 Q 6 0 12 15" fill="none" stroke="#c4600f" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <!-- mouth: hinge in front of and below the eye; lower jaw drops, upper lip lifts only slightly -->
    <path d="M44 -0.5 L31 -5 Q 27 3 32 14 Z" fill="#041a33"/>
    <!-- teeth (upper jaw only, inside the mouth) -->
    <path d="M33 -4.2 L36.3 -3 L34.6 0.2 Z" fill="#fff"/>
    <path d="M37 -2.8 L40.3 -1.6 L38.6 1.6 Z" fill="#fff"/>
    <!-- eye: above and behind the jaw -->
    <circle cx="22.5" cy="-11" r="6.4" fill="#fff"/>
    <circle cx="22.5" cy="-11" r="6.4" fill="none" stroke="#041a33" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="24.3" cy="-10.6" r="3.5" fill="#041a33"/>
    <circle cx="25.6" cy="-12.3" r="1.2" fill="#fff"/>
  </g>
</svg>
